<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="header">
    <div class="shell site-header__inner">
        <a class="brand" th:href="@{/}" href="/">
            <span class="brand__mark" aria-hidden="true">CB</span>
            <span class="brand__name">
                <strong>Campus</strong>
                <span>Book Market</span>
            </span>
        </a>

        <nav class="primary-nav"
             aria-label="주요 메뉴"
             th:attr="aria-label=#{aria.primary.navigation}">
            <a class="primary-nav__link"
               th:href="@{/posts}"
               th:text="#{nav.posts}">거래 게시판</a>

            <th:block th:if="${loginMember == null}">
                <a class="primary-nav__link"
                   th:href="@{/login}"
                   th:text="#{nav.login}">로그인</a>
                <a class="primary-nav__link primary-nav__link--accent"
                   th:href="@{/members/new}"
                   th:text="#{nav.join}">회원가입</a>
            </th:block>

            <th:block th:if="${loginMember != null}">
                <a class="primary-nav__link" th:href="@{/trades}" th:text="#{trade.history}">내 거래</a>
                <span class="primary-nav__member"
                      th:text="#{nav.member.greeting(${loginMember.name})}">김동민님</span>
                <form class="primary-nav__form"
                      th:action="@{/logout}"
                      method="post">
                    <button class="primary-nav__link primary-nav__link--accent"
                            type="submit"
                            th:text="#{nav.logout}">로그아웃</button>
                </form>
            </th:block>
        </nav>
    </div>
</header>

<footer class="site-footer" th:fragment="footer">
    <div class="shell site-footer__inner">
        <p>Campus Book Market</p>
        <p th:text="#{footer.copy}">대학생 전공책과 학습용품 거래 공간</p>
    </div>
</footer>
</body>
</html>
