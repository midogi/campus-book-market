<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 목록 - Campus Book Market</title>
</head>
<body>
<header>
    <a href="/">Campus Book Market</a>
</header>

<main>
    <h1>게시글 목록</h1>
    <p><a href="/posts/new">게시글 등록</a></p>

    <form th:action="@{/posts}" method="get">
        <div>
            <label for="keyword">제목 검색</label>
            <input id="keyword" name="keyword" type="search"
                   th:value="${keyword}" placeholder="전공책 이름을 입력하세요">
        </div>

        <div>
            <label for="status">거래 상태</label>
            <select id="status" name="status">
                <option value="">전체 상태</option>
                <option th:each="tradeStatus : ${tradeStatuses}"
                        th:value="${tradeStatus.name()}"
                        th:text="${tradeStatus.displayName}"
                        th:selected="${tradeStatus == selectedStatus}">
                    판매 중
                </option>
            </select>
        </div>

        <div>
            <label for="sort">정렬</label>
            <select id="sort" name="sort">
                <option th:each="sortOption : ${sortOptions}"
                        th:value="${sortOption.name()}"
                        th:text="${sortOption.displayName}"
                        th:selected="${sortOption == selectedSort}">
                    최신순
                </option>
            </select>
        </div>

        <button type="submit">검색</button>
        <a th:if="${!#strings.isEmpty(keyword)
                    or selectedStatus != null
                    or selectedSort.name() != 'LATEST'}"
           th:href="@{/posts}">초기화</a>
    </form>

    <p th:if="${#lists.isEmpty(posts) and #strings.isEmpty(keyword) and selectedStatus == null}">
        아직 등록된 게시글이 없습니다.
    </p>
    <p th:if="${#lists.isEmpty(posts) and (!#strings.isEmpty(keyword) or selectedStatus != null)}">
        조건에 맞는 게시글이 없습니다.
    </p>

    <ul th:unless="${#lists.isEmpty(posts)}">
        <li th:each="post : ${posts}">
            <a th:href="@{/posts/{postId}(postId=${post.id})}" th:text="${post.title}">게시글 제목</a>
            <span th:text="${post.price} + '원'">0원</span>
            <span th:text="${post.sellerName}">판매자</span>
            <span th:text="${post.status.displayName}">판매 중</span>
        </li>
    </ul>

    <nav th:if="${postPage.totalPages > 0}" aria-label="게시글 페이지">
        <a th:unless="${postPage.first}"
           th:href="@{/posts(keyword=${keyword}, status=${selectedStatus}, sort=${selectedSort}, page=${postPage.previousPage})}">
            이전
        </a>

        <span th:each="pageNumber : ${postPage.pageNumbers}">
            <strong th:if="${pageNumber == postPage.currentPage}"
                    th:text="${pageNumber}">1</strong>
            <a th:unless="${pageNumber == postPage.currentPage}"
               th:href="@{/posts(keyword=${keyword}, status=${selectedStatus}, sort=${selectedSort}, page=${pageNumber})}"
               th:text="${pageNumber}">1</a>
        </span>

        <a th:unless="${postPage.last}"
           th:href="@{/posts(keyword=${keyword}, status=${selectedStatus}, sort=${selectedSort}, page=${postPage.nextPage})}">
            다음
        </a>
    </nav>
</main>
</body>
</html>
