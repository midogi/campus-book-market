spring.application.name=campus-book-market

# Local development database. File mode keeps data between application restarts.
spring.datasource.url=jdbc:h2:file:./data/campus-book-market;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway owns schema changes; Hibernate only verifies that entity mappings match it.
spring.jpa.hibernate.ddl-auto=validate
# Keep persistence work inside explicit transaction boundaries instead of the web view.
spring.jpa.open-in-view=false
# SQL logging is enabled while the project is being used for JPA study.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Uploaded images are stored outside the application build output.
app.file.upload-dir=${UPLOAD_DIR:./uploads}

# One post image can be at most 5 MB.
spring.servlet.multipart.max-file-size=5MB

# The complete request includes the image and text form fields.
spring.servlet.multipart.max-request-size=6MB