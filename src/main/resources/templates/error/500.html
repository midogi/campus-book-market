<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error.500.title}">서버 오류가 발생했습니다</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/site :: header}"></header>

<main class="page-shell">
    <section class="empty-state">
        <strong>500</strong>

        <h1 th:text="#{error.500.heading}">요청을 처리하지 못했습니다</h1>

        <p th:text="#{error.500.description}">
            일시적인 서버 오류가 발생했습니다.
            잠시 후 다시 시도해 주세요.
        </p>

        <a class="button button--primary"
           th:href="@{/}"
           th:text="#{link.home}">
            홈으로 돌아가기
        </a>
    </section>
</main>

<footer th:replace="~{fragments/site :: footer}"></footer>
</body>
</html>
