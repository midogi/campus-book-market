<!DOCTYPE html>
<html lang="ko"
      th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title th:text="#{title.member.create}">
        회원가입 - Campus Book Market
    </title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
<a class="skip-link" href="#main-content" th:text="#{aria.skip.content}">본문으로 건너뛰기</a>
<header th:replace="~{fragments/site :: header}"></header>

<main id="main-content" class="page-shell page-shell--wide auth-page">
    <section class="auth-intro">
        <div class="auth-intro__mark" aria-hidden="true">CB</div>
        <p class="eyebrow">Campus Book Market</p>
        <h1 th:text="#{page.member.create}">회원가입</h1>
        <p th:text="#{home.description}">
            대학생 전공책과 학습용품을 거래하는 공간입니다.
        </p>
    </section>

    <form class="form-panel form-stack"
          th:action="@{/members}"
          th:object="${memberCreateForm}"
          method="post">

        <div class="field">
            <label for="loginId"
                   th:text="#{label.member.loginId}">
                로그인 아이디
            </label>

            <input id="loginId"
                   type="text"
                   autocomplete="username"
                   th:field="*{loginId}"
                   th:classappend="${#fields.hasErrors('loginId')} ? 'is-invalid' : ''"
                   th:attr="aria-invalid=${#fields.hasErrors('loginId')}">

            <p class="field-error"
               th:if="${#fields.hasErrors('loginId')}"
               th:errors="*{loginId}">
                로그인 아이디 오류
            </p>
        </div>

        <div class="field">
            <label for="password"
                   th:text="#{label.member.password}">
                비밀번호
            </label>

            <input id="password"
                   type="password"
                   autocomplete="new-password"
                   th:field="*{password}"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                   th:attr="aria-invalid=${#fields.hasErrors('password')}">

            <p class="field-error"
               th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}">
                비밀번호 오류
            </p>
        </div>

        <div class="field">
            <label for="passwordConfirm"
                   th:text="#{label.member.passwordConfirm}">
                비밀번호 확인
            </label>

            <input id="passwordConfirm"
                   type="password"
                   autocomplete="new-password"
                   th:field="*{passwordConfirm}"
                   th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'is-invalid' : ''"
                   th:attr="aria-invalid=${#fields.hasErrors('passwordConfirm')}">

            <p class="field-error"
               th:if="${#fields.hasErrors('passwordConfirm')}"
               th:errors="*{passwordConfirm}">
                비밀번호 확인 오류
            </p>
        </div>

        <div class="field">
            <label for="name"
                   th:text="#{label.member.name}">
                이름
            </label>

            <input id="name"
                   type="text"
                   autocomplete="name"
                   th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                   th:attr="aria-invalid=${#fields.hasErrors('name')}">

            <p class="field-error"
               th:if="${#fields.hasErrors('name')}"
               th:errors="*{name}">
                이름 오류
            </p>
        </div>

        <div class="form-actions">
            <a class="button button--secondary" th:href="@{/}" href="/"
               th:text="#{link.home}">홈으로 돌아가기</a>
            <button class="button button--primary" type="submit"
                    th:text="#{button.member.create}">회원가입</button>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/site :: footer}"></footer>
</body>
</html>
