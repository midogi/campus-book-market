<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title} + ' - Campus Book Market'">게시글 상세 - Campus Book Market</title>
</head>
<body>
<header>
    <a href="/">Campus Book Market</a>
</header>

<main>
    <article>
        <h1 th:text="${post.title}">게시글 제목</h1>

        <dl>
            <div>
                <dt>가격</dt>
                <dd th:text="${post.price} + '원'">0원</dd>
            </div>
            <div>
                <dt>판매자</dt>
                <dd th:text="${post.sellerName}">판매자</dd>
            </div>
            <div>
                <dt>거래 상태</dt>
                <dd th:text="${post.status.displayName}">판매 중</dd>
            </div>
            <div>
                <dt>등록 시각</dt>
                <dd th:text="${post.createdAt}">2026-08-11T10:00</dd>
            </div>
            <div>
                <dt>수정 시각</dt>
                <dd th:text="${post.updatedAt}">2026-08-11T10:00</dd>
            </div>
        </dl>

        <section>
            <h2>상품 설명</h2>
            <p th:text="${post.description}">상품 설명</p>
        </section>

        <section>
            <h2>거래 상태 변경</h2>

            <form th:action="@{/posts/{postId}/status(postId=${post.id})}"
                  method="post">
                <button type="submit" name="status" value="SALE">
                    판매 중
                </button>
                <button type="submit" name="status" value="RESERVED">
                    예약 중
                </button>
                <button type="submit" name="status" value="SOLD">
                    판매 완료
                </button>
            </form>
        </section>

    </article>

    <a th:href="@{/posts/{postId}/edit(postId=${post.id})}">수정</a>
    <a href="/posts">목록으로 돌아가기</a>
    <form th:action="@{/posts/{postId}/delete(postId=${post.id})}" method="post">
        <button type="submit">삭제</button>
    </form>
</main>
</body>
</html>
